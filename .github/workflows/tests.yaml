name: Tests

# Runs the M0 test layers on GitHub-hosted runners. Never publishes.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pytest==8.4.2" "pyyaml==6.0.2"

      - name: Run host tests
        run: python -m pytest tests/test_metadata.py tests/test_access.py tests/test_ingress_config.py -q -p no:cacheprovider

  image:
    name: Image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image (build fails if nginx -t fails)
        run: |
          docker build --platform "${{ matrix.platform }}" \
            -t "hermes-agent-ha:ci-${{ matrix.arch }}" hermes_agent

      - name: Verify architecture
        run: |
          docker image inspect "hermes-agent-ha:ci-${{ matrix.arch }}" --format '{{.Architecture}}'

      - name: Seeder tests against the image's own python-dotenv
        run: |
          mkdir -p "$RUNNER_TEMP/testrun"
          cp -R tests hermes_agent repository.yaml "$RUNNER_TEMP/testrun/"
          cat > "$RUNNER_TEMP/testrun/run.sh" <<'EOF'
          set -e
          cd /w
          pip_target=/tmp/pt
          mkdir -p "$pip_target"
          /opt/hermes/.venv/bin/python -c "import zipfile,glob,os; [zipfile.ZipFile(w).extractall('$pip_target') for w in glob.glob('/w/wheels/*.whl')]"
          PYTHONPATH="$pip_target:/w" /opt/hermes/.venv/bin/python -m pytest tests/test_options_seed.py -q -p no:cacheprovider
          EOF
          python3 -m pip download -q --only-binary=:all: -d "$RUNNER_TEMP/testrun/wheels" "pytest==8.4.2"
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$RUNNER_TEMP/testrun:/w" --entrypoint sh \
            "hermes-agent-ha:ci-${{ matrix.arch }}" /w/run.sh

      - name: Container boot smoke test (fail-closed without a supervisor address)
        run: |
          set -e
          cid=$(docker run -d --platform "${{ matrix.platform }}" "hermes-agent-ha:ci-${{ matrix.arch }}")
          for i in $(seq 1 60); do
            if docker logs "$cid" 2>&1 | grep -q 'FAIL-CLOSED: no valid Supervisor address'; then break; fi
            sleep 2
          done
          docker logs "$cid" 2>&1 | grep -q 'FAIL-CLOSED: no valid Supervisor address'
          docker logs "$cid" 2>&1 | grep -q 'hermes-app-seed'
          docker rm -f "$cid" >/dev/null

name: Builder

env:
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Publishing happens automatically, only on a push to main that changes the app
  # version (hermes_agent/config.yaml). A manual dispatch can publish on demand.
  # Every required check (Tests, Lint) must pass before this workflow runs, because
  # the branch protection rule on main only lets a commit land after they pass.
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to GHCR now (manual override)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Publish only when the app version changed in this push. Routine pushes
      # (docs, CI, tooling) build nothing and publish nothing.
      - name: Detect app version change
        id: version
        run: |
          set -euo pipefail
          new=$(git show HEAD:hermes_agent/config.yaml | sed -n 's/^version: "\(.*\)"$/\1/p')
          old=$(git show HEAD~1:hermes_agent/config.yaml 2>/dev/null | sed -n 's/^version: "\(.*\)"$/\1/p' || true)
          if [ -n "$new" ] && [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::app version ${old:-none} -> ${new}: publishing"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app version unchanged (${new}): not publishing"
          fi

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@07f46fd2e19967768b5fd3000f91f857452b767c # master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          changed_apps=()

          # If the workflow file itself changed, rebuild all apps
          if [[ "${CHANGED_FILES}" =~ \.github/workflows/(builder|build-app)\.yaml ]]; then
            changed_apps=(${APPS})
          else
            for app in ${APPS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${app}/${file} ]]; then
                  changed_apps+=("${app}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishing waits for the required checks on this same commit. A version bump
  # is never published from a commit whose tests or lint failed.
  verify:
    name: Verify required checks
    needs: init
    if: needs.init.outputs.version_changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for Tests and Lint on this commit
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            out=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="Host unit tests" or .name=="Image amd64" or .name=="Image aarch64" or (.name|startswith("Lint app")))] | {pending: [.[] | select(.status!="completed")] | length, failed: [.[] | select(.status=="completed" and .conclusion!="success" and .conclusion!="skipped")] | length, total: length}')
            pending=$(echo "$out" | jq -r .pending); failed=$(echo "$out" | jq -r .failed); total=$(echo "$out" | jq -r .total)
            if [ "$failed" != "0" ]; then echo "::error::a required check failed on ${GITHUB_SHA}; not publishing"; exit 1; fi
            if [ "$total" -ge 4 ] && [ "$pending" = "0" ]; then echo "required checks green on ${GITHUB_SHA}"; exit 0; fi
            sleep 20
          done
          echo "::error::required checks did not finish in time; not publishing"; exit 1

  build-app:
    name: Build ${{ matrix.app }}
    needs: [init, verify]
    if: always() && needs.init.outputs.changed == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      # Publish on a version change in a push to main, or on a manual override.
      publish: ${{ (github.event_name == 'push' && needs.init.outputs.version_changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    secrets: inherit

version: 2

# Keeps the pinned GitHub Actions, the Docker base image and the test
# requirements fresh. Version updates wait a few days after release (cooldown);
# security updates are not subject to cooldown.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/hermes_agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "docker"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "test"
    groups:
      test-deps:
        patterns:
          - "*"

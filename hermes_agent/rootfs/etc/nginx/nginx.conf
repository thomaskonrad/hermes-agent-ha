worker_processes 1;
pid /run/hermes-ingress/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    access_log /dev/stdout;

    # WebSocket upgrade helper for /api/pty and /api/display/ws.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream's Host guard wants the bound interface; Origin is only rewritten
    # when the client sent one.
    map $http_origin $normalized_origin {
        ''      '';
        default http://127.0.0.1:9119;
    }

    # Vite lazy-chunk rewrite (sub_filter): the search pattern is the quoted
    # string "assets/ (the quote is part of the pattern, not the replacement).
    # The replacement is the ingress prefix followed by assets/ when the header
    # is present. Without the header the replacement is assets/ unchanged, so
    # no root-absolute "/assets/" and no doubled quote is produced.
    map $http_x_ingress_path $ingress_asset_prefix {
        ''      'assets/';
        default "$http_x_ingress_path/assets/";
    }

    include /etc/nginx/conf.d/*.conf;
}

worker_processes 1;
pid /run/hermes-ingress/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    access_log /dev/stdout;

    # WebSocket upgrade helper for /api/pty and /api/display/ws.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream's Host guard wants the bound interface; Origin is only rewritten
    # when the client sent one.
    map $http_origin $normalized_origin {
        ''      '';
        default http://127.0.0.1:9119;
    }

    # Vite lazy-chunk rewrite (sub_filter): the search pattern is the quoted
    # string "assets/ (the quote is part of the pattern, not the replacement).
    # The SPA's lazy-chunk loader prepends "/" to every map string itself. So the
    # replacement must be the ingress prefix WITHOUT its leading slash. With a
    # leading slash the loader builds "//api/hassio_ingress/..." (host "api") and
    # the lazy Chat/System chunks fail with "Unable to preload CSS". Without the
    # header the replacement is assets/ unchanged.
    map $http_x_ingress_path $ingress_asset_prefix {
        "~^/(.+)$" "$1/assets/";
        default    'assets/';
    }

    include /etc/nginx/conf.d/*.conf;
}

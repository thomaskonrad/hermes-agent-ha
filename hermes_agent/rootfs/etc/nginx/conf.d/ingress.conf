server {
    listen 8099 default_server;
    server_name _;

    # Generated from the Supervisor address at startup (40-ingress-access).
    # Contains `allow <IPv4>;` then `deny all;`. Applies to every location,
    # including /ha-health, because it is set at server scope.
    include /run/hermes-ingress/supervisor-access.conf;

    # Supervisor watchdog target: healthy only when the dashboard answers.
    location = /ha-health {
        proxy_pass http://127.0.0.1:9119/api/status;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;

        # WebSockets: /api/pty (Chat tab) and /api/display/ws (Bot Screen)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Match the bound interface (upstream's Host guard)
        proxy_set_header Host   127.0.0.1:9119;
        proxy_set_header Origin $normalized_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HA Ingress -> the header upstream expects
        proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;

        # Vite lazy-chunk strings: "assets/... -> "<ingress prefix>/assets/...
        # Only rewritten when X-Ingress-Path is present; see the
        # ingress_prefix_set map in nginx.conf. Without the header the body
        # passes through unchanged (no root-absolute "/assets/" is created).
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter '"assets/' '"$ingress_asset_prefix';
        # NB: the replacement keeps the leading quote via the search pattern;
        # see nginx.conf for why the map holds only the prefix.

        proxy_buffering    off;      # streaming
        proxy_read_timeout 3600s;    # long-lived RFB / PTY sockets
        proxy_send_timeout 3600s;
        client_max_body_size 16m;    # matches HA Ingress' own cap
    }
}

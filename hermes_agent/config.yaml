# Hermes Agent — Home Assistant app (experimental, milestone M0).
# Concept: concepts/public-hermes-agent-ha-app.md (§10.1). Stage stays
# experimental until every §16 release gate is closed.
name: Hermes Agent
version: "0.22.5"
slug: hermes_agent
description: Self-hosted AI agent with a dashboard, long-term memory, skills and a built-in browser
url: https://github.com/thomaskonrad/hermes-agent-ha/tree/main/hermes_agent
arch:
  - aarch64
  - amd64
image: ghcr.io/thomaskonrad/hermes-agent-ha
init: false                      # the image runs s6-overlay as PID 1
startup: application
boot: auto
stage: experimental
timeout: 60                      # the gateway wants more than the 10 s default to stop
ingress: true
ingress_port: 8099
panel_title: Hermes Agent
panel_icon: mdi:robot-happy-outline
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/ha-health

map:
  - type: data
    path: /opt/data              # upstream's own data path (concept §5)
    read_only: false

backup: cold

environment:
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_HOST: "127.0.0.1"
  HERMES_GATEWAY_BOOTSTRAP_STATE: "running"

options:
  openrouter_api_key: ""
  ha_token: ""
schema:
  openrouter_api_key: "password?"
  ha_token: "password?"

# Hardening: every value is the safest one.
host_network: false
host_pid: false
host_ipc: false
host_dbus: false
hassio_api: false
homeassistant_api: false
docker_api: false
privileged: []
devices: []
full_access: false
apparmor: true
